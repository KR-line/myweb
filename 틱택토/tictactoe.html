<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #f0f4f8;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        }

        #title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #334155;
        }

        #container {
            width: 324px;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #334155;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(51, 65, 85, 0.25);
        }

        .box {
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .box:hover {
            background-color: color-mix(in srgb, var(--user-color, #e2e8f0) 30%, white);
        }

        #btn {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: #6366f1;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        #btn:hover {
            background: #4f46e5;
        }

        #btn:active {
            transform: scale(0.95);
        }

        #palette {
            width: 324px;
            /* 판과 같은 폭 */
            display: flex;
            flex-direction: column;
            /* 내 색 줄 위, 컴퓨터 색 줄 아래 */
            gap: 14px;
        }

        .group {
            display: flex;
            flex-direction: column;
            /* 이름표 위, 동그라미 아래 */
            gap: 6px;
        }

        .label {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        .colors {
            display: flex;
            gap: 4px;
        }

        .swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(51, 65, 85, 0.25);
            transition: transform 0.1s;
        }

        .swatch:hover {
            transform: scale(1.2);
        }

        .swatch.selected {
            box-shadow: 0 0 0 2px #334155;
            /* 선택된 색: 진한 테두리 */
        }

        /* 눈이 편한 파스텔 색 12가지 */
        .red {
            background: #f4a6a6;
        }

        .pink {
            background: #f7b9d3;
        }

        .orange {
            background: #f7bf8f;
        }

        .yellow {
            background: #f6e3a1;
        }

        .lime {
            background: #d5e5a0;
        }

        .green {
            background: #b7d3a8;
        }

        .mint {
            background: #a8dccb;
        }

        .lightblue {
            background: #a9d6ec;
        }

        .blue {
            background: #8fb0e3;
        }

        .purple {
            background: #c3b6e0;
        }

        .brown {
            background: #d4b9a0;
        }

        .gray {
            background: #cbd5e1;
        }
    </style>
</head>

<body>
    <div id="title">
        틱택토
    </div>

    <div id="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div>
        <button id="btn">초기화</button>
    </div>
    <div id="palette">
        <div id="userColor" class="group">
            <div class="label">내 색</div>
            <div class="colors">
                <div class="swatch red selected"></div>
                <div class="swatch pink"></div>
                <div class="swatch orange"></div>
                <div class="swatch yellow"></div>
                <div class="swatch lime"></div>
                <div class="swatch green"></div>
                <div class="swatch mint"></div>
                <div class="swatch lightblue"></div>
                <div class="swatch blue"></div>
                <div class="swatch purple"></div>
                <div class="swatch brown"></div>
                <div class="swatch gray"></div>
            </div>
        </div>
        <div id="comColor" class="group">
            <div class="label">컴퓨터 색</div>
            <div class="colors">
                <div class="swatch red"></div>
                <div class="swatch pink"></div>
                <div class="swatch orange"></div>
                <div class="swatch yellow"></div>
                <div class="swatch lime"></div>
                <div class="swatch green"></div>
                <div class="swatch mint"></div>
                <div class="swatch lightblue"></div>
                <div class="swatch blue selected"></div>
                <div class="swatch purple"></div>
                <div class="swatch brown"></div>
                <div class="swatch gray"></div>
            </div>
        </div>
    </div>


    <script>

        const outer = document.getElementById("container");
        const board = ['', '', '', '', '', '', '', '', '']
        let end = false


        //클릭이벤트
        outer.addEventListener("click", (e) => {
            if (end) {
                return
            }
            if (!e.target.classList.contains('box')) {
                return;
            }
            console.log(e.target)

            //입력 받기...
            const children = outer.children;
            const list = Array.from(children);
            const index = list.indexOf(e.target);
            if (board[index] !== '') {
                return;
            }
            //user턴
            board[index] = 'o'
            e.target.style.backgroundColor = userBg;

            if (winCondition('o')) {
                setTimeout(() => {
                    alert("유저 승리!")
                }, 50);
                end = true;
                return;
            }


            //com 턴
            const empty = [];   //비어있는 칸 저장하는 배열
            for (let i = 0; i < board.length; i++) { //board배열 전체를 돌면서
                if (board[i] === "") {                //빈 공간이 있다면
                    empty.push(i);                  //empty 배열에 넣는다 여기서 i는 board배열의 인덱스가 됨
                }
            }

            if (empty.length === 0) {
                end = true;
                setTimeout(() => {
                    alert("무승부....")
                }, 50);
                return;
            }

            let com = find('x'); //find 함수로 컴퓨터의 말(x)이 이길 가능성 있는 칸을 찾기 (찾았다면 인덱스 번호가 저장될것이고 아니라면 -1)
            if (com === -1) { //찾지 못했다면 user이 이길 가능성있는 칸을 찾기
                com = find('o'); //(마찬가지로 찾았다면 인덱스 번호 저장)
            }
            if (com === -1) { //역시 찾지 못했다면
                com = empty[Math.floor(Math.random() * empty.length)]//랜덤 자리에 두기
            }


            board[com] = 'x'
            list[com].style.backgroundColor = comBg;



            if (winCondition('x')) {
                end = true;
                setTimeout(() => {
                    alert("com 승리!")
                }, 50);
            }

        })
        //승리 조건 확인하기
        //승리 조건 : {012} {345} {678} {036} {147} {258} {642} {840}
        const winline = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [6, 4, 2], [8, 4, 0]
        ];
        function winCondition(player) {

            for (let i = 0; i < winline.length; i++) {
                const a = winline[i][0] //winner 배열의 i번째의 첫번째 숫자
                const b = winline[i][1] //winner 배열의 i번째의 두번째 숫자
                const c = winline[i][2] //winner 배열의 i번째의 세번째 숫자
                if (board[a] === player && board[b] === player && board[c] === player) {//board[a]와 [b]와 [c]에 들어간 문자가 player랑 같은지 비교
                    return true
                }
            }
            return false;
        }

        const btn = document.getElementById("btn");
        btn.addEventListener('click', () => {
            for (let i = 0; i < board.length; i++) {
                board[i] = "";
                outer.children[i].style.backgroundColor = "";
            }

            end = false;

        })

        function find(player) {
            for (let i = 0; i < winline.length; i++) { //승리조건 배열을 돌며
                let count = 0;         // 그 줄에서 player이 차지한 칸 수
                let emptyindex = -1; //처음에는 빈공간을 찾지 못한 상태로 둔다.
                for (let j = 0; j < 3; j++) { //승리조건 i번 인덱스 안에 있는 숫자들을 돌며
                    const pos = winline[i][j] //그 숫자를 pos에 집어넣어서
                    if (board[pos] === player) { //그 숫자에 해당하는 칸을 player이 차지했다면
                        count++                 // 그 줄에서 몇칸 차지했는지 수를 센다.
                    } else if (board[pos] === '') { //그 칸이 비어있다면
                        emptyindex = pos; //그 칸이 board의 몇번 인덱스인지 기록한다.
                    }                       //상대의 칸이면 아무것도 안한다.
                }
                if (count === 2 && emptyindex !== -1) { //내칸이 2개 있다 && 빈칸이 1개 있다
                    return emptyindex //빈칸의 board 인덱스
                }
            }
            return -1
        }

        // 처음 선택된 색 읽어 오기
        let userBg = getComputedStyle(document.querySelector("#userColor .selected")).backgroundColor;
        let comBg = getComputedStyle(document.querySelector("#comColor .selected")).backgroundColor;
        outer.style.setProperty("--user-color", userBg);

        document.getElementById("palette").addEventListener("click", (e) => {
            if (!e.target.classList.contains("swatch")) return;   // 동그라미가 아니면 무시

            const group = e.target.closest(".group");             // 내 색 묶음인지 컴퓨터 색 묶음인지
            const color = getComputedStyle(e.target).backgroundColor;

            if (group.id === "userColor") {
                if (color === comBg) { alert("컴퓨터와 같은 색이에요"); return; }
                userBg = color;
                outer.style.setProperty("--user-color", userBg);   // 추가
            } else {
                if (color === userBg) { alert("내 색과 같은 색이에요"); return; }
                comBg = color;
            }

            // 선택 표시 옮기기: 그 묶음에서 selected를 모두 지우고, 누른 것에만 붙이기
            group.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
            e.target.classList.add("selected");
        });



    </script>
</body>

</html>
